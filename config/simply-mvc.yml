services:
  _defaults:
    public: true
    autowire: true
    autoconfigure: true

  Simply\Mvc\:
    resource: '../src/'
    exclude:
      - '../src/Attribute/'
      - '../src/Controller/ControllerResolver.php'
      - '../src/Controller/Resolvers/'
      - '../src/DependencyInjection/'
      - '../src/MvcPlugin.php'
      - '../src/Request.php'
      - '../src/Resources/'
      - '../src/Routing/Route.php'

  Simply\Mvc\Hook\TemplateInclude:
    tags: ['container.service_subscriber']
